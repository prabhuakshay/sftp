APP=/var/www/app
STAMP=$(date +%Y%m%d-%H%M)
RELEASE="$APP/releases/$STAMP"

echo "Deploying $STAMP"
git clone --depth 1 git@github.com:example/app.git "$RELEASE"
cd "$RELEASE"
npm ci --omit=dev
ln -sfn "$APP/shared/.env" .env
ln -sfn "$RELEASE" "$APP/current"
sudo systemctl reload app

# Keep the five newest releases
ls -1dt $APP/releases/* | tail -n +6 | xargs rm -rf
echo "Done"`;

    toast(`Uploading ${files.length === 1 ? files[0].name : files.length + ' files'} to ${tab.host}:${to}`, { icon: 'upload' });
  };
  const pickUpload = (tab) => {

    openEntry, download, upload, pickUpload, cancelTransfer, retryTransfer, clearFinished, openTerminal, runCommand, clearCmdLog: () => setCmdLog([]),
    copy, toggleBookmark, isBookmarked, act, refresh, setSort, startSearch, clearSearch, openMenu, openMenuAt, closeMenu: () => setMenu(null), entryMenu, folderMenu,

}

function useTabView(app, tab) {
  const all = useMemo(() => (tab.host ? listDir(tab.host, tab.path) : []), [tab.host, tab.path, app.tick]);

function PathBar({ app, tab, variant = 'bar', className = '' }) {
  const h = hostOf(tab.host);
  const [edit, setEdit] = useState(false);
  const [val, setVal] = useState(tab.path);
  const inp = useRef(null);
  useEffect(() => { setEdit(false); setVal(tab.path); }, [tab.path, tab.id]);
  useEvent('focus-path', () => setEdit(true));
  useEffect(() => { if (edit && inp.current) { inp.current.focus(); inp.current.select(); } }, [edit]);
  const commit = () => {
    const p = resolvePath(val, tab.path, h.home);
    if (!p) return;
    setEdit(false); app.navigate(p);
  };
  const big = variant === 'big';
  const box = variant === 'bar' ? 'h-8 px-1.5 rounded-md bg-bg border border-line' : big ? 'h-10 px-1 rounded-lg' : 'h-7 px-1 rounded-md';
  if (edit) {
    return <input ref={inp} value={val} onChange={e => setVal(e.target.value)} onBlur={() => setEdit(false)}
      onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setEdit(false); setVal(tab.path); } }}
      className={`${box} ${className} font-mono ${big ? 'text-[15px] px-3' : 'text-[12.5px] px-2'} outline-none border border-accent bg-panel min-w-0`} />;
  }
  const crumbs = [{ label: big ? tab.host : '/', path: big ? h.home : '/' }];
  if (big) crumbs.push({ label: '/', path: '/' });
  segs(tab.path).forEach((p, i, a) => crumbs.push({ label: p, path: '/' + a.slice(0, i + 1).join('/') }));
  return (
    <div onClick={e => { if (e.target === e.currentTarget) setEdit(true); }} title="Click empty space or press Ctrl+L to type a path (~ and relative paths work)"
      className={`flex items-center min-w-0 overflow-hidden cursor-text ${box} ${className}`}>
      {variant === 'bar' && <span className="shrink-0 flex items-center gap-1.5 px-1.5 h-5 mr-1 rounded bg-chip text-[11.5px]"><Dot state={app.conn[tab.host]} />{tab.host}</span>}
      {crumbs.map((c, i) => {
        const last = i === crumbs.length - 1;
        return (
          <Fragment key={i}>
            {i > 0 && !(big && i === 1) && !(i === 1 && !big) && <Icon name="chevronRight" size={big ? 16 : 13} className="text-muted opacity-60 mx-px" />}
            {big && i === 1 && <span className="text-muted mx-1 text-[18px]">:</span>}
            <button onClick={() => app.navigate(c.path)}
              className={`shrink-0 truncate max-w-[220px] px-1.5 rounded hover:bg-hover ${big ? (i === 0 ? 'text-[18px] text-accent font-semibold' : last ? 'text-[18px] font-semibold' : 'text-[18px] text-muted') : last ? 'font-medium' : 'text-muted'}`}>
              {c.label}
            </button>
          </Fragment>
        );
      })}
      <div className="flex-1 self-stretch" onClick={() => setEdit(true)} />
    </div>
  );
}

function hl(line, lang) {

    const body = m ? m[2] : line;
    return <>{m && <span className="text-muted">{m[1]}</span>}<span className={/error|fail|invalid|502|BLOCK/i.test(body) ? 'text-bad' : /warn|404/i.test(body) ? 'text-warn' : ''}>{body}</span></>;
  }
  const re = lang === 'js'
    ? /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)|\b(const|let|var|function|return|import|from|async|await|new|true|false|null)\b|\b(\d+(?:\.\d+)?)\b/g

    last = re.lastIndex;
    if (!m[0].length) re.lastIndex++;
  }
  out.push(line.slice(last));
  return out;
}

  return j === q.length;

              <span className="pr-2 whitespace-nowrap">{sel.length.toLocaleString()} selected · {fmtSize(sumSize(sel))}</span>
              {[['download', 'Download', () => app.download(tab, sel)], ['copy', 'Copy paths', () => app.copy(sel.map(e => joinPath(tab.path, e.name)).join('\n'))], ['lock', 'Permissions', () => app.act('perms', sel)], ['trash', 'Delete', () => app.act('delete', sel)]].map(([i, l, f]) => (
                <button key={l} onClick={f} className={`h-8 px-3 rounded-full hover:bg-white/15 flex items-center gap-1.5 whitespace-nowrap ${i === 'trash' ? 'text-[#FF9A8A]' : ''}`}><Icon name={i} size={14} />{l}</button>
              ))}
              <button onClick={() => app.updateTab(tab.id, () => ({ sel: [] }))} className="h-8 w-8 rounded-full hover:bg-white/15 grid place-items-center"><Icon name="x" size={14} /></button>
            </div>
          )}
        </div>
      </>}
      {app.ui.run && tab.host && (
        <div className="fixed inset-0 z-40 bg-black/30 flex items-end" onMouseDown={e => e.target === e.currentTarget && app.setUi({ run: false })}>
          <div className="w-full h-[46%] bg-panel rounded-t-2xl border-t border-line shadow-2xl overflow-hidden rise flex flex-col">
            <div className="h-1.5 w-12 rounded-full bg-line mx-auto mt-2 shrink-0" />
            <div className="flex-1 min-h-0"><CommandRunner app={app} tab={tab} onClose={() => app.setUi({ run: false })} /></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ===================================================================== root: menu, toasts, variant switcher */
function MenuHost({ app }) {
  const m = app.menu, ref = useRef(null);
  const [pos, setPos] = useState(null);
  useOutside(ref, !!m, app.closeMenu);
  useEffect(() => {
    if (!m) return;
    const esc = (e) => e.key === 'Escape' && app.closeMenu();
    window.addEventListener('keydown', esc); window.addEventListener('blur', app.closeMenu);
    return () => { window.removeEventListener('keydown', esc); window.removeEventListener('blur', app.closeMenu); };
  }, [m]);
  useLayoutEffect(() => {
    if (!m || !ref.current) { setPos(null); return; }
    const r = ref.current.getBoundingClientRect();
    setPos({ x: Math.max(8, Math.min(m.x, innerWidth - r.width - 8)), y: Math.max(8, Math.min(m.y, innerHeight - r.height - 8)) });
  }, [m]);
  if (!m) return null;
  return (
    <div ref={ref} style={{ left: (pos || m).x, top: (pos || m).y, visibility: pos ? 'visible' : 'hidden' }} className="fixed z-50 min-w-[230px] py-1 rounded-lg bg-panel border border-line shadow-xl text-[12.5px]">
      {m.items.map((it, i) => it.sep
        ? <div key={i} className="h-px bg-line my-1" />
        : (
          <button key={i} onClick={() => { app.closeMenu(); it.onClick && it.onClick(); }}
            className={`w-full flex items-center gap-2.5 px-3 h-8 text-left hover:bg-hover ${it.danger ? 'text-bad' : ''}`}>
            <Icon name={it.icon || 'blank'} size={15} className={it.danger ? '' : 'text-muted'} />
            <span className="flex-1">{it.label}</span>
            {it.check && <Icon name="check" size={14} className="text-accent" />}
            {it.kbd && <span className="text-muted text-[11px]">{it.kbd}</span>}
          </button>
        ))}
    </div>
  );
}
function Toasts({ app }) {
  return (
    <div className="fixed right-4 bottom-16 z-50 flex flex-col gap-2 w-[400px] max-w-[90vw] pointer-events-none">
      {app.toasts.map(t => (
        <div key={t.id} className="pointer-events-auto rounded-lg bg-panel border border-line shadow-xl px-3.5 py-3 text-[12.5px] flex gap-3 rise">
          <Icon name={t.icon || (t.kind === 'bad' ? 'alert' : 'info')} size={16} className={t.kind === 'bad' ? 'text-bad' : t.kind === 'ok' ? 'text-ok' : 'text-accent'} />
          <div className="min-w-0">
            <div className="font-medium">{t.text}</div>
            {t.sub && <div className="text-muted text-[12px] mt-0.5">{t.sub}</div>}
            {t.mono && <div className="font-mono text-[11px] text-muted mt-1.5 break-all bg-term rounded px-2 py-1">{t.mono}</div>}
          </div>
        </div>
      ))}
    </div>
  );
}
const VARIANTS = [
  { key: 'A', name: 'Explorer', C: VariantA },
  { key: 'B', name: 'Workbench', C: VariantB },
  { key: 'C', name: 'Focus', C: VariantC },
];
function Root() {
  const app = useApp();
  const appRef = useRef(app); appRef.current = app;
  const params = new URLSearchParams(location.search);
  const [v, setV] = useState(() => (VARIANTS.some(x => x.key === params.get('variant')) ? params.get('variant') : 'A'));
  const [dark, setDark] = useState(() => (params.get('theme') ? params.get('theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches));
  const setParam = (k, val) => { try { const u = new URL(location.href); u.searchParams.set(k, val); history.replaceState(null, '', u); } catch (e) {} };
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); setParam('theme', dark ? 'dark' : 'light'); }, [dark]);
  const go = (key) => { setV(key); setParam('variant', key); };
  const idx = VARIANTS.findIndex(x => x.key === v), cur = VARIANTS[idx];
  const step = (d) => go(VARIANTS[(idx + d + VARIANTS.length) % VARIANTS.length].key);
  useEvent('keydown', (e) => {
    const a = appRef.current, t = e.target, typing = t.closest && t.closest('input, textarea, [contenteditable="true"]');
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); a.goBack(); }
    else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); a.goForward(); }
    else if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); a.goUp(); }
    else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); window.dispatchEvent(new Event('focus-path')); }
    else if (e.ctrlKey && e.key.toLowerCase() === 'f') { e.preventDefault(); window.dispatchEvent(new Event('focus-filter')); }
    else if (e.key === 'F5') { e.preventDefault(); a.refresh(); }
    else if (e.key === 'Escape' && a.ui.run) a.setUi({ run: false });
    else if (!typing && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey && e.key === 'ArrowLeft') step(-1);
    else if (!typing && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey && e.key === 'ArrowRight') step(1);
  });
  const V = cur.C;
  return (
    <>
      <V key={v} app={app} />
      <MenuHost app={app} />
      <Toasts app={app} />
      <div className="fixed bottom-3 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-0.5 h-9 px-1 rounded-full bg-[#0B0E10] text-white shadow-2xl ring-2 ring-[#FFC24A]/70 text-[12px] select-none">
        <button onClick={() => step(-1)} title="Previous variant (←)" className="h-7 w-7 grid place-items-center rounded-full hover:bg-white/15"><Icon name="chevronLeft" size={15} /></button>
        <span className="px-1.5 text-[9.5px] font-bold tracking-widest text-[#FFC24A]">PROTOTYPE</span>
        <span className="min-w-[120px] text-center">{cur.key} · {cur.name}</span>
        <button onClick={() => step(1)} title="Next variant (→)" className="h-7 w-7 grid place-items-center rounded-full hover:bg-white/15"><Icon name="chevronRight" size={15} /></button>
        <span className="w-px h-4 bg-white/25 mx-1" />
        <button onClick={() => setDark(d => !d)} title="Light / dark" className="h-7 w-7 grid place-items-center rounded-full hover:bg-white/15"><Icon name={dark ? 'sun' : 'moon'} size={14} /></button>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
